spring:
  application:
    name: instructions-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/instructions_db}
    username: ${DB_USERNAME:instructions_user}
    password: ${DB_PASSWORD:instructions_password}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

server:
  port: 8080
